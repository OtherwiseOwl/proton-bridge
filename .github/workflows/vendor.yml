# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
on:
  workflow_dispatch:
env:
  version: 3.27.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - name: Build
      run: go mod vendor
    - name: Create archive
      run: |
        mkdir "proton-bridge-${{ env.version }}"
        mv vendor "proton-bridge-${{ env.version }}"
        tar -czvf "proton-bridge-${{ env.version }}".tar.xz" "proton-bridge-${{ env.version }}"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: "proton-bridge-${{ env.version }}.tar.xz"
        path: "proton-bridge-${{ env.version }}.tar.xz"
        archive: false
